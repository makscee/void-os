<!doctype html>
<!--
  void-os scaffold: FEED (dominant interaction: hx-ext=sse + sse-connect, live append)

  COPY to panels/<slug>.html, register via page.register. Daemon serves at /p/<slug>,
  substitutes {{VOS_SLUG}}, injects htmx. CUSTOMIZE the marked spots; keep the token <style>,
  the data-vos-source attr, and the SSE wiring.

  The htmx SSE extension is VENDORED INLINE below (htmx-ext-sse 2.2.3, ~2.8KB) so hx-ext="sse"
  works with no CDN (htmx 2.x ships SSE as a separate ext, not in core). It self-registers via
  htmx.defineExtension, so the inline <script> must load AFTER the daemon-injected htmx tag.

  v1 LIVE VIEW: sse-connect opens an EventSource to the feed stream; new lines append on each
  named event. The daemon wires the stream in P4; until then the connect URL 404s harmlessly.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed</title>
<script src="/assets/htmx.min.js"></script>
<style>
:root {
  color-scheme: dark;
  --background: 222.2 84% 4.9%;
  --foreground: 210 40% 98%;
  --card: 222.2 84% 4.9%;
  --card-foreground: 210 40% 98%;
  --primary: 210 40% 98%;
  --primary-foreground: 222.2 47.4% 11.2%;
  --secondary: 217.2 32.6% 17.5%;
  --secondary-foreground: 210 40% 98%;
  --muted: 217.2 32.6% 17.5%;
  --muted-foreground: 215 20.2% 65.1%;
  --accent: 217.2 32.6% 17.5%;
  --accent-foreground: 210 40% 98%;
  --destructive: 0 62.8% 30.6%;
  --destructive-foreground: 210 40% 98%;
  --border: 217.2 32.6% 17.5%;
  --input: 217.2 32.6% 17.5%;
  --ring: 212.7 26.8% 83.9%;
  --radius: 0.5rem;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 1rem; max-width: 640px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: hsl(var(--background)); color: hsl(var(--foreground));
  -webkit-font-smoothing: antialiased; line-height: 1.5;
}
input[type="checkbox"], input[type="radio"] { accent-color: hsl(var(--primary)); }
input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="reset"]),
textarea, select {
  font: inherit; background: hsl(var(--background)); color: hsl(var(--foreground));
  border: 1px solid hsl(var(--input)); border-radius: calc(var(--radius) - 2px);
}
input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="reset"]):focus,
textarea:focus, select:focus { outline: none; border-color: hsl(var(--ring)); }
h1 { font-size: 1.1rem; margin: 0 0 1rem; }
#events { display: flex; flex-direction: column; gap: 0.5rem; }
.event {
  background: hsl(var(--card)); color: hsl(var(--card-foreground));
  border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
  padding: 0.55rem 0.7rem; font-size: 0.9rem;
}
.event time { color: hsl(var(--muted-foreground)); font-size: 0.75rem; margin-right: 0.5rem; }
</style>
</head>
<body>
<!-- CUSTOMIZE the glob; daemon watches it for SSE reload. -->
<div data-vos-source="work/tasks/active/*.md">
  <h1>Feed — {{VOS_SLUG}}</h1>

  <!-- hx-ext="sse" + sse-connect open an EventSource; sse-swap names the event whose data
       appends here. CUSTOMIZE the stream path + event name to your daemon feed route. -->
  <div hx-ext="sse" sse-connect="/p/{{VOS_SLUG}}/feed">
    <div id="events"
         sse-swap="message"
         hx-swap="beforeend">
      <!-- new .event fragments append here as they arrive -->
    </div>
  </div>
</div>

</body>
</html>
