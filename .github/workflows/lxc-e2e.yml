name: lxc-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cli/init.ts'
      - 'cli/init/**'
      - 'cli/ask.ts'
      - 'cli/daemon.ts'
      - 'e2e/lxc/**'
      - 'tools/mint-claudev-code.sh'
      - '.github/workflows/lxc-e2e.yml'

concurrency:
  group: lxc-e2e
  cancel-in-progress: false   # queue, don't preempt a running LXC

jobs:
  lxc-e2e:
    runs-on: [self-hosted, lxc-tower]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure bun on PATH
        run: |
          if ! command -v bun >/dev/null; then
            curl -fsSL https://bun.sh/install | bash
          fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: bun install
        run: bun install

      - name: Mint claudev access code
        env:
          VOID_AUTH_URL: ${{ secrets.VOID_AUTH_URL }}
          VOID_AUTH_USER_ID: ${{ secrets.VOID_AUTH_USER_ID }}
        run: |
          CODE=$(./tools/mint-claudev-code.sh)
          echo "::add-mask::$CODE"
          echo "CLAUDEV_ACCESS_CODE=$CODE" >> "$GITHUB_ENV"

      - name: LXC E2E
        env:
          TOWER_HOST: tower
        run: ./e2e/lxc/run.sh
